settings:
  dialog_key: '^(Dialog|CS)/'
  max_line: 42

ignore:
  - check: consistency
    key: '^(Difficulty/Normal|Options/NormalOption|Difficulty/ScreenTitle|Difficulty/SliderLabel|PauseMenu/DifficultyButtonLabel)$'
    reason: '"Normalny" (level) and "Normalne" (setting); the menu button captioned "Ustawienia" shortened to "Trudność".'
  - check: english
    key: '^(Difficulty/Ironman|Options/AudioSurroundOption|PauseMenu/OptionsButtonSubLabel|PauseMenu/Start)$'
    reason: words used the same in Polish (Ironman, surround, Menu, Start).
  - check: english
    key: '^(Key/|Language/|Profile/(HealthCount|MeritsCount|MeritsCountSingular)$)'
    reason: key names used unchanged in Polish, language names in their own language, bare tokens.
  - check: plurals
    key: '^costsXMerits$'
    reason: "written as a label with a colon, so declension doesn't depend on the number."
  - check: consistency
    key: '.'
    reason: reviewed; differences come from context (map abbreviation vs full room name, key vs action, imperative vs state).
  - check: terms
    key: '^(CS/CS_Care_Prog2_PAN1_Text1|Challenges/long haul description)$'
    reason: 'term rendered as a pronoun or a shorter form ("części do zadań").'
  - check: capitals
    key: '^(CS/CS_Prog5_PG2_PAN1_Text1|Offense/(DEADEYE|TRIGGER_HAPPY))$'
    reason: proper names (Orbitalne Centrum…, Pac Force).
  - check: typography
    key: '^(CS/CS_Prog1_PG1_PAN1_Text2|Legend/HeartstarterTerminal|MapPopup/(Maintenance|Rendition)|Star Map Event/BombDescription|StartMenu/UnlockFoon|desc_long_[a-f]|desc_short|tydy_desc_long_[a-f])$'
    reason: the EN trailing space is most likely an authoring leftover with nothing appended (paragraphs, descriptions, legend caption); review 2026-09-26. Spaces before an appended number (Challenges/DifficultySelect*) were added.
