keep_english: [Kindred, Kindred Aerospace, Vyper, GROB, AR-Y 26, Hot Garbage, Javelin, EKO, Martin Tweed, Kindex, KARDZ, Nomad, Teratomo, Kronus, Alienware]

settings:
  dialog_key: '^(VO|SUB)_'

ignore:
  - {check: gender, key: '^VO_EKO_RefuelJavelin_Start_01$', reason: '"tytułem" is a noun'}
  - {check: gender, key: '^VO_EKO_OBJ_SurveyPlanet_Start_01$', reason: '"rozdziałem" is a noun'}
  - {check: terms, key: '^VO_EKO_(Report1_Greeting|B5_CallToAdventure)_01$', reason: 'vocative "explorer" dropped (gendered in Polish)'}
