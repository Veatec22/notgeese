    pl: Javelin
    forms: [Javelin]
    source: user
    note: ship name, declined (Javelina, na Javelinie); rejected "Oszczep"
  - en: Kindred
    pl: Kindred
    forms: [Kindred]
    source: decision
    note: company, indeclinable, neuter in verbs ("Kindred zobowiązało się"); "Kindred Aerospace" in full
  - en: Pufferbird
    pl: puchoptak
    forms: [puchopta]
    source: user
    note: translated per user ruling on creature names; puch + puchnąć; rejected keeping English
  - en: Pikemander
    pl: pikamandra
    forms: [pikamandr]
    source: decision
    note: pika + salamandra (it's a spiky lizard)
  - en: Survey
