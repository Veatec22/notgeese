# First match wins; the rest goes to "Do uporządkowania".
rules:
  - {group: barks, match: '^dlg/(Boss_|People Around)'}
  - {group: dialogue, match: '^dlg/'}
  - {group: dialogue, context: '^speaker label'}
  - {group: settings, match: '^rewired/'}
  - {group: settings, context: '^dropdown option'}
  - {group: levels, context: '^(level title|level location|boss epithet|intro card|conversation card)'}
  - {group: tutorial, context: '^loading tip'}
  - {group: game, match: '^fmt/'}
  - {group: game, context: '^weapon name'}
  - {group: game, context: '^label \((resources|sharedassets3)\.assets\)'}
  - {group: menu, match: '^ui/'}

