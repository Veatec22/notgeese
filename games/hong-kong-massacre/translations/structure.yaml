# The Hong Kong Massacre: groups and sequences for the review workspace.
# Format: docs/workspace.md. Sequences follow Dialogue System links; speakers from the
# entries' Actor field.

format: 1

groups:
  - {id: dialogue, name: Rozmowy}
  - {id: barks, name: Groźby bossów i przechodnie}
  - {id: levels, name: Tytuły poziomów i plansze z datami}
  - {id: menu, name: Menu i nawigacja}
  - {id: settings, name: Ustawienia i sterowanie}
  - {id: tutorial, name: Samouczek i podpowiedzi}
  - {id: game, name: "Rozgrywka, broń i wyniki"}

