settings:
  dialog_key: '^Articy_'

ignore:
  - {check: typography, key: '^(UI|Game)/', reason: 'straight quotes are inside input-icon markup id="…", not prose'}
  - {check: english, key: '\.(Text|MenuText)$', reason: 'BLANK, >>BLANK, CUT, debug lines, interjections (Heh, Hmm, Wow, Rrrgh, HAHAHAHA) kept as in the game'}
  - {check: english, key: '^(UI|Game)//', reason: 'Demon, System, Katana are the same word in Polish'}
  - {check: plurals, key: '19A62B914FFBA03F3A8328A63138AF22', reason: 'counter after a colon, no inflection needed'}
  - {check: terms, key: 'INSPECTABLE_CHILD_SUNKENCITY', reason: 'Hunter is the child''s name in this email, not the hunter'}
  - {check: terms, key: 'DEMON_BEAR_ABOUT_1200', reason: 'possessing rendered as being in the teddy bear'}
  - {check: consistency, key: '(Leave|MenuText|Survivor)', reason: 'menu Leave (Wyjdź) vs dialogue choice (Odejdź); gendered job titles; pan/pani by addressee'}
  - {check: consistency, key: '.', reason: 'same EN with different PL checked by hand: addressee gender/formality, case of echoed names, tense by situation'}
  - {check: capitals, key: '.', reason: 'proper names of places, gangs, departments and bosses are capitalized in Polish too'}
