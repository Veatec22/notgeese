# Possessor(s): groups and sequences for the review workspace.
# Format: docs/workspace.md.
# Sequences: one per Articy scene, line order from the key number. Speakers are not in the game
# data; they were assigned from the text (reconstructed); lines without a speaker are minor
# characters outside the bible, system texts or unclear.

format: 1

groups:
  - {id: menu, name: 'Menu i interfejs'}
  - {id: settings, name: 'Ustawienia'}
  - {id: tutorial, name: 'Samouczek i podpowiedzi'}
  - {id: quests, name: 'Zadania i cele'}
  - {id: world, name: 'Przedmioty, umiejętności, miejsca i postacie'}
  - {id: d-intro, name: 'Dialogi: początek (wieżowiec Agradyne i ulice)'}
  - {id: d-campus, name: 'Dialogi: Wzgórze Kampusowe'}
  - {id: d-park, name: 'Dialogi: Park Jarzeniowy'}
  - {id: d-mall, name: 'Dialogi: Martwa Galeria'}
  - {id: d-zoo, name: 'Dialogi: SanZooQuarium'}
  - {id: d-sunken, name: 'Dialogi: Zatopione Miasto'}
  - {id: d-dock, name: 'Dialogi: Zardzewiałe Doki'}
  - {id: d-plaza, name: 'Dialogi: Odwrócona Plaza'}
  - {id: d-dream, name: 'Dialogi: sen'}
  - {id: d-lab, name: 'Dialogi: laboratorium i zakończenia'}
  - {id: d-side, name: 'Dialogi: zadania poboczne i minibossowie'}
  - {id: d-extra, name: 'Dialogi: rozmowy o Dessie i koszmary'}
  - {id: inspectables, name: 'Terminale i e-maile'}

rules:
  - {group: settings, match: '^UI/(PoseSettings|GameSetting)'}
  - {group: tutorial, match: '^UI/ST_Tutorial/'}
  - {group: menu, match: '^UI/'}
  - {group: quests, match: '^Narrative/'}
  - {group: world, match: '^Game/'}
  - {group: inspectables, match: '^Articy_Inspectables/'}
  - {group: d-intro, match: '^Articy_Intro/'}
  - {group: d-campus, match: '^Articy_Region_CampusHill/'}
  - {group: d-park, match: '^Articy_Region_FluorescentPark/'}
  - {group: d-mall, match: '^Articy_Region_DeadMall/'}
  - {group: d-zoo, match: '^Articy_Region_Zooquarium/'}
  - {group: d-sunken, match: '^Articy_Region_SunkenCity/'}
  - {group: d-dock, match: '^Articy_Region_Dockyard/'}
  - {group: d-plaza, match: '^Articy_Region_InvertedPlaza/'}
  - {group: d-dream, match: '^Articy_Region_Dream/'}
  - {group: d-lab, match: '^Articy_Region_Lab/'}
  - {group: d-side, match: '^Articy_SideQuests/'}
  - {group: d-extra, match: '^Articy_Default/'}

