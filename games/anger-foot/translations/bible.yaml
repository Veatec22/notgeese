# Anger Foot translation bible: facts with sources. Format: .claude/skills/localization/SKILL.md
# Written after the fact (2026-09-22): the translation predates the skill; this records what was adopted.

sources:
  - id: table
    description: >
      Speaker and To fields of every LocalizedString (e.g. "NPC (Female)" > "Player").
      The game gives speaker and addressee gender itself. In the review they sit in the key:
      `<path> [speaker > addressee]`. Dump: tools/ref_extract.py -> work/ref-all.json (not committed).
  - id: context
    description: Description field (developer notes for translators), `context` in the review.
  - id: ru
    description: Russian table of the game; addresses the player consistently in masculine ("ты опоздал", "ты пришёл").

characters:
  - id: player
    name: Anger Foot
    gender: m
    addresses_player: '-'
    register: never speaks; others address him with "ty"
    declension: vocative unchanged ("Mam cię dość, Anger Foot!"), genitive "Anger Foota" ("Buty Anger Foota")
    source: [ru, table]
  - id: npc-f
    name: female characters (NPCs, Anger Girl, Prezeska)
    gender: f
    key: '\[[^\]>]*\(Female\) >'
    addresses_player: ty
    source: [table]
  - id: npc-m
    name: male characters (NPCs, Minister Zbrodni, Glut Glina, Pizza Świnia, delivery guy)
    gender: m
    key: '\[[^\]>]*\(Male\) >'
    addresses_player: ty
    source: [table]
  - id: anger-girl
    name: Anger Girl
    gender: f
    register: the hero's girlfriend, energetic, casual ("Ekstra!", "Ruszamy!"); her name never appears in the Polish text
    source: [table, context]
  - id: minister
    name: Minister Zbrodni
    gender: m
    register: politician, pompous villain monologue; addresses the player as "Anger Foot"
    source: [table, context]
  - id: ceo
    name: Prezeska
    gender: f
    register: head of the Business Gang (Office Boss (Female)); "The CEO" is a title, hence the capital
    source: [table]
  - id: pizza-pig
    name: Pizza Świnia
    gender: m
    declension: >
      "Świnia" declines like a feminine noun (Pizza Świni, Pizza Świnio), but verbs and pronouns
      are masculine because it's a he ("Pizza Świnia próbował nas zabić", "jego dodatki").
    source: [table]
  - id: goo-cop
    name: Glut Glina
    gender: m
    declension: both parts decline ("Glutem Gliną", "Gluta Gliny"); partner Worek Glina likewise ("Worku Glino!")
    source: [table, context]
  - id: trash-boss
    name: Baron Mazi / Umysł Brudu
    gender: m
    register: '"Neutral" in the table; masculine in Polish following the names (Baron, Umysł)'
    source: decision
    note: the names are masculine, so masculine forms sound natural ("jestem taki zapominalski").

