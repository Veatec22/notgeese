settings:
  dialog_key: '^Dialogue/'
  max_line: 60   # speech bubbles over characters, the game wraps; no hard limit

ignore:
  - check: plurals
    key: '^UI/Star Goals/'
    reason: >
      "zbirów", "wrogów", "lewitujących" (masculine-personal) are correct for any number from 2; goals with 1
      don't exist. Non-personal ones rebuilt as "karaluchy: {0}", "węże: {0}".
  - check: plurals
    key: '^UI/(Challenge Levels|HUD)/'
    reason: >
      rebuilt ("w czasie poniżej {0} s", "kopiąc mniej niż {0} razy", "strzały w głowę: {0}");
      "Kopnąłeś {0} razy." explained in decisions
  - check: english
    key: 'Urinal Puker|Child 2|Oinker 4|Mathematician 4|Tester 3|Fine Art Thinker|Water Cooler 3|Antialiasing|Display/Gamma|Ambient Occlusion|Enable Bloom|Challenge Bonus|Save Slot|Main Menu/Start|Tutorials/(Drifting|Gamepad Driving)|Credits/(DAQA|LQA)|Vape Collectible Type'
    reason: onomatopoeia, interjections, technical abbreviations and words adopted in Polish (Amen, Wow, Bloom, Vape, Slot, Start, Bonus)
  - check: consistency
    key: '(Default|Continue)'
    reason: deliberate; "Domyślny" counter mode vs "Domyślne" button; "Dalej" after a level vs "Wróć do gry" in pause
  - check: typography
    key: '(Window Lady 2|Energy Drinker 3|Organic Trash Man 1|Default Button)'
    reason: trailing space in the original is a developer typo, nothing gets appended
