# Wild Bastards bible: facts with sources.

sources:
  - id: keys
    description: "I2 keys with gendered variants (e.g. HUD/Dead and HUD/DeadFem, UIMG/Injured and UIMG/InjuredFem)."
  - id: text
    description: "The game's original text (tutorials and dialogue call outlaws he/her, Miss, ma'am)."
  - id: fr
    description: "The game's French table (work/ref-fr.json): gender in adjectives and participles (archère, sûre, ange-gardienne)."
  - id: it
    description: "The game's Italian table (work/ref-it.json): gender in nouns (sacerdotessa, pistolera, arciera)."
  - id: ru
    description: "The game's Russian table is empty (2 entries); no gender source."
  - id: vb
    description: "Our Void Bastards PL (games/void-bastards): same developer, related jokes and vocabulary"

characters:
  - id: billy
    name: "Billy"
    gender: m
    register: "country boy, dialect, „panie Casino”, „panie Bum”; a squid (tentacles)"
    source: [text, fr]
  - id: rosa
    name: "Pajęcza Rosa (Spider Rosa)"
    gender: f
    register: "cold, haughty, no dialect; „Matrona klanu”; others say „panno Roso”, McNeil „Robaczyco” (Bug Lady)"
    source: [text, it]
  - id: casino
    name: "Casino (Doc Casino)"
    gender: m
    register: "gambler robot, dialect, „przyjacielu”, „kolego” (pard); „Casino” indeclinable (Doca Casino)"
    source: [fr, text]
  - id: kaboom
    name: "Kaboom („pan Bum”, „Boom”)"
    gender: m
    register: "gas miner, dialect, swearing"
    source: [text]
  - id: roswell
    name: "Roswell („Roz”, „Ros”)"
    gender: m
    register: "alien under a dome, haughty, scientific, no dialect"
    source: [text]
  - id: spike
    name: "Spike"
    gender: m
    register: "cockney („stary” = mate), hooked on shine"
    source: [text]
  - id: fletch
    name: "Fletch"
    gender: f
    register: "time-travelling archer; „psze pani”/„panienko” in dialogue is usually her"
    note: "Adult version of the third bastard (Młoda). Bastard1Recovered_2 in French: „ange-gardienne”."
    source: [text, fr, it]
  - id: preach
    name: "Kaznodzieja (Preach, Esther O'Neil)"
    gender: f
    register: "preacher with a gatling, biblical asides, dialect"
    declension: "„Kaznodzieja” like a masculine noun in -a, but with feminine syntax („Kaznodzieja dała”)"
    source: [it, text]
  - id: judge
    name: "Sędzia (The Judge)"
    gender: m
    register: "sniper robot, legal language („Przychylam się”), dialect"
    source: [text, fr]
  - id: sarge
    name: "Sierżant (Sarge)"
    gender: m
    register: "old war horse (cyborg horse), military dialect"
    source: [text, fr]
  - id: hopalong
    name: "Hopalong („Hop”, Vansak Largo)"
    gender: m
    register: "snake man, farmer, dialect, loves animals"
    source: [text, fr]
  - id: smoky
    name: "Smoky („Kuchcik” u Spike'a)"
    gender: m
    register: "cook robot; when upset he SHOUTS IN CAPS (kept)"
    source: [text]
  - id: rawhide
    name: "Rawhide"
    gender: m
    register: "robot with a p-squirrel swarm; says „my” and talks childishly („Ten Billy potrzebuje wielu pomocy”); English articles as „Ten/Ta”"
    source: [text, fr]
  - id: bastards
    name: "Mały Jeb (m), Jeb Junior (m), Młoda (f)"
    source: [text]
    note: "„She got a fin on her”: the third bastard is a girl."
  - id: princes
    name: "McNeil (m), Francisco (f), Barrabas (m), Jebediah Chaste (m)"
    source: [text]
    note: "Francisco is a woman („her younger brother”, „Chaste's daughter”)."
  - id: outlaws
    name: "banici ogólnie"
    gender: '?'
    note: >
      The game has separate "Fem" entries where the form depends on the outlaw's gender
      (Ranny/Ranna). Without such a variant, a sentence about any outlaw is genderless
      (e.g. "…Pals", "…JailPals" lines without the rescuer's gender).

