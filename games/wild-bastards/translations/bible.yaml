settings:
  dialog_key: '^Dialog/'
  max_line: 42

ignore:
  - check: consistency
    key: '^(HUD/Dead|UIMG/Injured|Options/(AccelerationOne|Normal|StandardResponse|AccelerationTwo|High|Q2))(Fem)?$'
    reason: "the game's gendered variants (Fem) and agreement with the setting's noun (przyspieszenie, jakość, krzywa)."
  - check: terms
    key: '^(Hint/(CasinoStunt|Gambler)|TalentDesc/(KABOOM_SNEAKY|LAIKA_CHARGE_SHIELDING))$'
    reason: "the word „stunt” replaced by the stunt's name (Ruletka, Odpalenie, niewidzialność)."
  - check: terms
    key: '^Dialog/(RosaInitArg_2|DogwoodSector_6|Frontier_2|AstronautJudgeArg_1)$'
    reason: "in dialogue „stunt” = numer, „shine” = lśnić, „pal” = kolego; not game terms."
  - check: terms
    key: '^(TalentRank/\d|TraitName/GoodItems|Location/ItemShop|InteractionDescription/Barricade|Hint/ScatterFind)$'
    reason: ace rank without the word „mod”; deliberate synonyms (łupy, handlarz, zapora, ci, którzy znajdą).
