keep_english: [Max Plank, ESC, TAA, SSAO, Bloom, FPS, System, INFERNO, IN MEMORIAM, Xalavier Nelson Jr., Draculae, Djedefre, James Savage, DM11, DM11s, Strikebreaker, Gullstock, Cavalry, Uzi, El Paso, PURGATORIO, OUROBOROS, VESPER, SENSORIUM, Tab, DING, DJEDE, Florence, Janet, James, JustFeelBetter, QRTXY, Plinkbyte]

settings:
  dialog_key: 'Subtitles'

ignore:
  - {check: terms, key: 'Tutorial', reason: '"stake" as a verb ("So I can stake--") is „wbijać”, not the noun „kołek”'}
  - {check: consistency, key: 'Ticker Message - EPN Tutorial 10', reason: 'tutorial alarm "RUN." = „UCIEKAJ.”; James to a hostage "Run." = „Biegnij.”'}
  - {check: consistency, key: 'Bark_Rescued', reason: 'see Ticker Message - EPN Tutorial 10'}
  - {check: capitals, key: 'Subtitles/|Xalavier', reason: 'speaker tags, names, Niebo/Piekło as places'}
  - {check: gender, key: '20_WhyAreYouHere - 14 - James', reason: 'James quotes Janet („Zapomniałam…”)'}
  - {check: gender, key: '34_FinalBoss - 11 - Draculae', reason: '„Nie jestem Diabłem”: noun, not a verb form'}
  - {check: typography, key: 'Credits|DIRECTOR', reason: 'straight quotes belong to nicknames in names'}
  - {check: english, key: 'Credits|DIRECTOR|JAMES SAVAGE', reason: 'names and asset titles stay'}
