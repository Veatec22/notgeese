# Site catalog: translation status and date added per game. The only place status is set.
#
# Each game sits under its status as `slug: date added` (YYYY-MM-DD). Changing status =
# moving that line under another status; the date moves with it. The date drives the
# "newest" sort. Every games/<slug>/game.yaml must sit under exactly one status or the
# site build stops and names the missing game.
#
# Status order here = tile order and filter order on the site.
# `label` goes on the badge, `description` into the badge hint in the game panel,
# `tone` is the badge look: ink (black), outline (frame only) or accent (crimson).
# `ready` is set only by the user after a full playthrough.

