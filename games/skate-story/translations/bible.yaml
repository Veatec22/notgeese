# Skate Story bible: facts with sources. Written after the fact (2026-09-22) for an existing translation.

sources:
  - id: type
    description: "TYPE column of the I2 table, dialogue speaker (\"Dialogue — Rabbie\"); dumped by tools/ref_extract.py to work/ref-all.json."
  - id: notes
    description: NOTES column of the I2 table, developer notes (133 entries), stored as `context`.
  - id: ru
    description: Russian column of the same table, past-tense gender; compared with PL by tools/gender_ru.py.
  - id: fr
    description: French column, settles doubtful RU ("Il m'a vu").

characters:
  - id: skater
    name: Skejter (Szklany Skejter, demon)
    gender: m
    addresses_player: '-'
    register: third-person past narration; everyone uses "ty" to the Skater, Licha from the Department "pan"
    source: [ru]
    note: genderless in EN ("the Skater", "it"); Polish masculine after "skejter" and "demon".
  - id: rabbit
    name: Królik / Rabbie → Gwiezdnooki Szczur
    gender: m
    register: buddy-like, tired, runs from trouble ("Wybacz")
    source: [ru, type]
  - id: philosopher
    name: Filozof
    gender: m
    register: pompous, "w istocie", "rozważmy", neologisms ("zadumiewające")
    source: [ru, type]
  - id: philoso
    name: Philoso
    gender: m
    register: speaks in rhymed quatrains; rhyme over literalness
    source: [type]
  - id: beea
    name: Beea (kwiaciarka)
    gender: f
    register: warm, "kochanie", "skarbie"
    source: [ru]
    note: RU "я обменяла"; Oscar calls her "ta ślicznotka z kwiaciarni".
  - id: coney
    name: Coney
    gender: m
    register: overzealous Fuss officer, "kolego", caps for regulations
    source: [ru]
  - id: frotue
    name: Frotue (Żaba)
    gender: m
    register: polite seller
    source: decision
    note: >
      masculine about himself ("Wcale tam nie spałem"), but narration calls him "Żaba", so
      "spytała Żaba", "Żaba płakała": agreement with the noun, like "Pizza Świnia" in Anger Foot.
  - id: licha
    name: Licha (telefon z Departamentu Śmierci)
    gender: f
    addresses_player: pan
    source: decision
    note: RU doesn't settle it; a clerk on the phone, "pańskiej umowy".
  - id: skeletons
    name: Szkielety (NPC)
    gender: m
    source: [ru, fr]
    note: each skeleton is another soul; at the Square of Regret RU "я понадеялся" and FR "il m'a vu" → "Myślałem".
  - id: millstone
    name: ??? (kamień młyński, ch9)
    gender: m
    source: decision
    note: RU feminine, ES ("enterrado") and FR ("enterré") masculine; Polish "kamień młyński" is masculine.
  - id: devils-robe
    name: Szata Diabła
    gender: f
    source: [ru]
  - id: penin
    name: Penin (Pingwin)
    gender: m
    register: snobbish jeweler, "skarbie", "mój drogi gryzoniu"
    source: [ru]
  - id: false-sun
    name: Fałszywe Słońce
    gender: n
    source: decision
    note: calls itself "Księżyc" in dialogue; verbs neuter after "Słońce" ("zaśmiało się").

