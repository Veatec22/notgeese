ignore:
  - check: english
    key: '^(Item/deck-|Item/sticker-|Item/truck-|Achievement/ach-(05|06|10)|Levels/|Speaker/|chapters/|quests/)'
    reason: proper names, partner games on decks and stickers, brands
  - check: capitals
    key: '.'
    reason: >
      the original capitalizes world entities (the Moon, the Skater, the Devil's Laundry);
      the translation keeps that style
  - check: consistency
    key: '^UI/'
    reason: '"OTWARTY" on the arch vs "Otwórz" in a hint, "dalej" vs "Kontynuuj": different places'
  - check: typography
    key: '(seizure-warning|5kickflip-1-seq-05)'
    reason: the health warning is the developers' existing text; the leading space is a source typo
