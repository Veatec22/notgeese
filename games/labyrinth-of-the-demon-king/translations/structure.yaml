# Labyrinth of the Demon King: groups and sequences for the review workspace.
# Format: docs/workspace.md. Groups by the asset that defines each key (`context`,
# tools/key_sources.py). Sequences: one per dialogue DataTable, rows in asset order.

format: 1

groups:
  - {id: intro, name: 'Wstęp: napisy do filmu'}
  - {id: menu, name: 'Menu, zapis i ekrany'}
  - {id: settings, name: 'Ustawienia i sterowanie'}
  - {id: tutorial, name: 'Samouczek i podpowiedzi'}
  - {id: hud, name: 'HUD, ekwipunek, mapa i sklepy'}
  - {id: servant, name: 'Dialogi: służąca'}
  - {id: merchant, name: 'Dialogi: handlarka'}
  - {id: kappa, name: 'Dialogi: kappa'}
  - {id: priest, name: 'Dialogi: kapłan'}
  - {id: demon-king, name: 'Dialogi: Król Demonów'}
  - {id: notes, name: 'Notatki'}
  - {id: items, name: 'Przedmioty, mapy i poziomy'}
  - {id: achievements, name: 'Osiągnięcia'}
  - {id: world, name: 'Świat: drzwi, zagadki i komunikaty'}

rules:
  - {group: intro, context: '^Movies/OpeningText_'}
  - {group: settings, context: '^(Blueprints/Widgets/Settings/|Blueprints/Widgets/PauseMenu/ControlLayoutWidgets/|AssetPacks/AutoSettings/)'}
  - {group: tutorial, context: '(UI_HowToPlay|_Tutorial)'}
  - {group: menu, context: '^Blueprints/(Widgets/(MainMenu|PauseMenu|SaveMenu|LanguageSelectScreen|GameOver|AchievementMenu)/|Widgets/UI_YesNoWidget|Misc/BP_(MainMenuPortal|NewGamePortal))'}
  - {group: hud, context: '^Blueprints/Widgets/'}
  - {group: servant, context: '^DataTables/dialogue/Servant_001/'}
  - {group: merchant, context: '^DataTables/dialogue/Merchant_001/'}
  - {group: kappa, context: '^DataTables/dialogue/Kappa_001/'}
  - {group: priest, context: '^DataTables/dialogue/Priest_001/'}
  - {group: demon-king, context: '^DataTables/dialogue/DemonKing/'}
  - {group: notes, context: '^DataTables/DT_NoteData'}
  - {group: items, context: '^DataTables/(ItemList|MapDataList|LevelDataList)'}
  - {group: achievements, context: '^DataTables/AchievementData'}
  - {group: world, context: '^(Blueprints|Maps|Cinematics)/'}

