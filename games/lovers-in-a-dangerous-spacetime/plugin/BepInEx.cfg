## Not Geese: Unity 5.0 crashes when BepInEx starts from Application's static constructor
## (GameObject.AddComponent during assembly loading). Start it from the game's localizer instead:
## it runs the first time the game asks for a text, always before the language list is built.
## BepInEx fills in every other setting with its defaults.

[Preloader.Entrypoint]

## The local filename of the assembly to target.
# Setting type: String
# Default value: UnityEngine.dll
Assembly = Assembly-CSharp.dll

## The name of the type in the entrypoint assembly to search for the entrypoint method.
# Setting type: String
# Default value: Application
Type = Localizer

## The name of the method in the specified entrypoint assembly and type to hook and load Chainloader from.
# Setting type: String
# Default value: .cctor
Method = .cctor
