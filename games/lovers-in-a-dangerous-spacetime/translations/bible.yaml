# Lovers in a Dangerous Spacetime translation bible: facts with sources. Format: .claude/skills/localization/SKILL.md

sources:
  - id: keys
    description: LocalizationSet keys; Dialog.* are Dr. Hopsy-Flopsy's lines, Dialog.Tutorial.1P* only in single-player
  - id: ru
    description: Russian table (work/ref-ru-ru.json); surname "Прыгской" masculine
  - id: es
    description: Spanish table (work/ref-es-es.json); "el Dr. Peluchín"
  - id: wiki
    description: Heroes Wiki, Doctor Hopsy-Flopsy ("he", anthropomorphic rabbit, guide)
    url: https://hero.fandom.com/wiki/Doctor_Hopsy-Flopsy
  - id: audio
    description: 'No voice lines: one chatter loop LOV Hopsy Flopsy Initial/Loop/End_v1 (sharedassets6.assets)'

style:
  tone: cheerful sci-fi fairy tale about love; doctor is upbeat, a little scatterbrained, puns and deadpan asides
  adaptation: text only (chatter loop, no words) → free; keep facts, mechanics hints and every joke's function; no memes, no swearing (none in EN)
  reading_conditions: doctor's dialogue pops up during play, crew busy piloting stations; likely auto-dismiss (to test in the vertical) → concise
  source: [audio, decision]
  note: starting point from the direction sample (docs/decisions.md), re-check after full

characters:
  - id: doctor
    name: dr Hopsa-Siupsa
    gender: m
    key: '^Dialog\.'
    addresses_player: wy
    register: warm, excited, quick; plural „wy” to the crew, singular „ty” in Dialog.Tutorial.1P* and GetMap1Player
    declension: dr Hopsa-Siupsa (only nominative used)
    examples:
      - {key: Dialog.Tutorial.GetMap, en: "That's your map station! Use it to... map.", pl: "To wasze stanowisko mapy! Służy do... mapowania."}
      - {key: Dialog.Orion1.Intro, en: "The temperature in this region is approaching absolute zero. Stay frosty!", pl: "Temperatura w tym rejonie zbliża się do zera absolutnego. Zachowajcie zimną krew!"}
    source: [wiki, ru, es, user]
    note: name agreed with user 2026-09-29 (rejected keeping „Hopsy-Flopsy”)

