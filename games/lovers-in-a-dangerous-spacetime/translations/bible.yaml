keep_english: [Lovers, Gamepad, Orion, Planetoidia, Lover, Banana Split, Yamato, XOXO, XInput, VSync, SPF, Kepler, Doppler, Riemann, Euler, Flapper, Hopper, Whisker, Webber, Mu, Rho, Pi, Nu, Upsilon, CPU, OK, Xbox, PS4]

settings:
  dialog_key: '^(Dialog|Cutscene)\.'

ignore:
  - {check: plurals, key: 'GUI.ControlsMenu.PlayerMode', reason: 'player number, nominative after "gracz"'}
  - {check: plurals, key: 'GUI.HubScreen.CannotUseSameProfileXbox', reason: '{0} is a profile name'}
  - {check: capitals, key: 'GUI.CampaignComplete.ReactorPieces', reason: 'Reaktor Żaru is a proper name'}
  - {check: length, key: 'Error.Save.PS4AccessBusy', reason: 'console-only message box'}
  - {check: length, key: 'GUI.SigninChange.Title', reason: 'console-only message box'}
  - {check: terms, key: 'GUI.StoreMenu.RankMessage', reason: '"go up a rank" = awansować'}
  - {check: length, key: 'Static.Credits.QaCompliance', reason: 'credits heading, full-width line'}
  - {check: length, key: 'Static.Credits.CoverArt', reason: 'credits heading, full-width line'}
