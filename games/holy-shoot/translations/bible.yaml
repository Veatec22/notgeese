# Holy Shoot translation bible: facts with sources. Format: .claude/skills/localization/SKILL.md

sources:
  - id: locres
    description: "PVD/Content/Localization/Game/en/Game.locres, Steam build 24334618 (the game's only language; no other tables)."
  - id: text
    description: "Original text: character descriptions (he/she), names, line context."

characters:
  - id: samuel
    name: "Naddźwiękowy Samuel (Supersonic Samuel)"
    gender: m
    key: 'SupersonicSamuel_'
    register: "ex-sprinter, cocky, brags about speed"
    source: [text]
    note: '"made him a hero", "his athletic career".'
  - id: toshiko
    name: "Toshiko Techno"
    gender: f
    key: 'ToshikoTechno_'
    register: "inventor, IT jargon (debug, patch, restart, 404)"
    source: [text]
    note: '"she fused tech with combat". DashDesc_Toshiko wrongly says "his path" in the original; Polish uses "swojej drodze".'
  - id: player
    name: "gracz (Samuel albo Toshiko)"
    gender: '?'
    note: "Everything said to the player (NPCs, bosses, fairy, descriptions) is genderless."
  - id: fairy
    name: "Wróżka, towarzyszka (Fairy Companion)"
    gender: f
    key: 'Fairy_'
    register: "mouthy, snarky"
    source: decision
    note: '"it" in the original; in Polish "wróżka", so feminine ("Przybyła twoja bohaterka").'
  - id: baron
    name: "Baron Przypalacz (Baron Burnsalot) – Szatan"
    gender: m
    key: 'BaronBurnsalot_'
    register: "spoiled baby: mummy, pacifier, baby tooth"
    source: [text]
  - id: lady
    name: "Lady Miłogeddon (Lady Lovemageddon) – Asmodeusz"
    gender: f
    key: 'LadyLovemageddon_'
    register: 'seductive, "kochanie"'
    source: [text]
  - id: mammon
    name: "Komornik (The Debtkeeper) – Mamona"
    gender: m
    key: 'Mammon_'
    register: "corporate-finance jargon"
    source: [text]
  - id: druid
    name: "Milka Krasula, Królowa Druidów (Milcah Kow)"
    gender: f
    source: [text]
    note: 'Pun "milk a cow" -> Milka the cow + Krasula.'
  - id: maya
    name: "Kupulkan, majański duch (Needapu)"
    gender: m
    source: decision
    note: '"Need a poo" -> Kukulkan + kupa; the line about name jokes still works.'
  - id: spearatrix
    name: "Spearatrix, spartańska wojowniczka"
    gender: f
    source: decision
    note: 'Ending -trix; line "byłam numerem 301".'

