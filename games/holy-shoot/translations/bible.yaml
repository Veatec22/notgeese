ignore:
  - check: english
    key: '^[0-9A-F]{32}$'
    reason: "developer diagnostic texts without namespace (Steam Stat Saved, MapOrigin, Use_1) stay verbatim."
  - check: terms
    key: '^(Tutorial_ElementalPerks_Description|U_U_PerkSaver_D|Tutorial_SoulboundLantern_Description)$'
    reason: '"run in fear" is fleeing, not a run; "dusz" is genitive plural.'
