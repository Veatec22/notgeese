  dialog_key: ^Dialog/
  max_line: 110
decisions:
- The 111 accepted vertical entries kept.
- Elevated narrator without artificial rhymes; journal in Adrestia's feminine first person.
- C.I.R.C.E. stays the system name; Circe as the chamber is Kirke.
- Polish has code pl and its own selector item; English is not replaced (user).
- The 110-char report limit comes from the accepted sample length; it doesn't guarantee reading pace for
  all subtitles.
- 'Review 2026-09-25: the chamber is always Kirke, also in CirceAutoSecurity1.2; C.I.R.C.E. only in the
  interface name.'
