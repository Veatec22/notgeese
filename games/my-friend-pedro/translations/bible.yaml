# Names, codes, slang, stylized shouts and key names checked in the full review.
keep_english:
  [Pedro, Mitch, ISP, LOL, GG, GLHF, Tab, Home, My Friend Pedro,
   Bob, John, Dave, Rutger, Ayoze, Hunter, Denny, 1337dealWithIT,
   ISP-23698, ISP-23701, ISP-88172, Mech, Shamona, 'Hahahahaha!', ZOMG,
   'Lag!', OMFG, 'Aggro!', 'Zerg!', MOB, Caps Lock, Menu, Backspace,
   Insert, Page Up, Page Down, End, Delete, Scroll Lock, HUD]

settings:
  dialog_key: '^w\d'

ignore:
  - check: tokens
    key: '^inNoMap$'
    reason: '[Not mapped] is label text, not a command.'
  - check: consistency
    key: '^(pep8|pep20|hChW|mChgWep|mKick|bul28)$'
    reason: The full review confirmed different functions of commands, action names and score messages, and acceptable praise variants.
  - check: capitals
    key: '^in23$'
    reason: Two equal commands "Skocz / Puść", not Title Case carried over from EN.
