sources:
  - id: exe
    description: Literals of the local Heat_Signature.exe (Steam build 6124596) with their GML function, tools/extract_strings.py -> work/strings.json.
  - id: dialog
    description: The game's Dialog/*.txt (13 files); markup [Block], #reply, {Target}, =continuation, <Token>.
  - id: scenarios
    description: Scenarios/*.dat; daily challenge characters, item names, mission descriptions.
  - id: log
    description: notgeese/LogOutput.log from the user's session (vertical); strings actually drawn, work/run-0.1.2.log.
  - id: tvtropes
    description: A search engine summarizes TV Tropes (page unavailable, 403); Breaker "he", Geneva "she", Mirfak "they". Unconfirmed.
    url: https://tvtropes.org/pmwiki/pmwiki.php/Characters/HeatSignature

style:
  tone: UI and instructions short, direct, second person. Item descriptions matter-of-fact; tagline quotes (faction ad slogans) with dry dark humor. Dialogue with dry humor, no added memes.
  adaptation: 'Keep the action and conditions of instructions; never write keys next to control icons. Numbers from holes stay digits; sentences with a number avoid declension ("Zabójstwa: 3").'
  source: decision
  note: Smoothing the terminal is a separate user ruling; it does not mean softening swearing in other dialogue.
  item_names: The game builds names from adjectives and a noun ("Rechargeable High Capacity Swapper"). In Polish the noun first, adjectives after it in reverse order agreeing in gender, phrases "o dużej pojemności"/"dalekiego zasięgu" at the end; when "..." truncates, the key word survives. item-* entries in translations/en-pl-review.json.

characters:
  - id: player
    name: losowa postać gracza
    gender: '?'
    addresses_player: '-'
    register: Comebacks in dialogue replies; no gender-revealing forms (present tense, impersonal).
    source: decision
    note: 'Characters are random (Female/Male in the EXE). Exception: in TutorialEnd the player is Fiasco.'
  - id: terminal
    name: Terminal treningowy
    gender: n
    addresses_player: ty
    register: Correct grammar, caps and machine enthusiasm.
    source: user
    note: User chose "smooth it anyway". Rejected deliberate errors "TRENING SIĘ ZACZĄĆ" and "ROBIĆ PRZEMOC".
    examples:
      - en: PRACTICE IS START
        pl: TRENING ROZPOCZĘTY
        source: user
      - en: EXCELLENT VIOLENCE!
        pl: ŚWIETNA WALKA!
        source: decision
  - id: fiasco
    name: Sader Fiasco
    gender: f
    addresses_player: ty
    register: Tired pro after forty years of spying; short dry remarks, blunt vocabulary.
    source: [dialog]
    note: 'Breaker about Fiasco: "she ain''t saying", "she killed their commander", "this white haired woman walks into my local" (BartenderDialogueFoundry.txt). The vertical wrongly used masculine forms ("wyobrażałem", "Dostałem"); fixed in the full translation.'
    examples:
      - en: This is not how I pictured my retirement.
        pl: Nie tak wyobrażałam sobie emeryturę.
        source: dialog
  - id: breaker
    name: Breaker Gemini
    gender: '?'
    addresses_player: ty
    register: Casual, chatty, ironic; ex-Foundry engineer, bartender.
    source: [dialog, tvtropes]
    note: Gender unconfirmed in game files; lines avoid gender-revealing forms. Name indeclinable ("z Breaker").
  - id: asli
    name: Asli Sixty
    gender: f
    addresses_player: ty
    register: Enthusiastic, childishly cheerful, gruesome details delivered with a smile.
    source: [dialog]
    note: 'About her first version: "She knew that when she pressed the button" (BartenderDialogueGlitchers.txt).'
  - id: geneva
    name: Geneva Stonelock
    gender: '?'
    addresses_player: ty
    register: Dry Offworld head of security, laconic, uncompromising.
    source: [dialog, tvtropes]
    note: Gender unconfirmed in files; neutral lines. TV Tropes summary says "she".
  - id: mirfak
    name: Mirfak Lagrange
    gender: '?'
    addresses_player: ty
    register: Warm, chatty, loves conspiracy theories; ex-Sovereign cryptographer.
    source: [dialog, tvtropes]
    note: Gender unconfirmed; neutral lines (present tense instead of "zostałem/zostałam").

