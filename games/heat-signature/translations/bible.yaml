user_decisions:
  - en: Yep. (player reply)
    pl: No tak.
    source: user
    note: Rejected "No.", easily read as a negation.
  - en: Holy shit you're alive.
    pl: Jasna cholera, żyjesz.
    source: user
    note: Rejected "O kurwa, żyjesz." as stronger than the original.
  - en: PACIFIST / Liberator
    pl: PACYFIZM / Wyzwolenie
    source: user
    note: Rejected masculine "PACYFISTA", "Wyzwoliciel" for random-gender characters.
  - en: Shiplocked
    pl: pokładowy / Sprzęt pokładowy
    source: user
    note: Rejected "przypisany do statku" (ambiguous before "dalekiego zasięgu").
  - en: missions board / jobs board / Job Listings / Mission Listings
    pl: tablica zleceń / Oferty zleceń
    source: user
    note: The reviewer proposed "tablica misji"; the user chose "zlecenia".
