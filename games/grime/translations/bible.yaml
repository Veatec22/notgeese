sources:
- id: keys
  description: GOG 1.3.5 I2 table; NPC/scene names and numeric line suffixes in keys.
- id: code
  description: GameOptions IL in AD_Scripts.dll; I2 metadata in AD_Localization.dll.
- id: opening
  description: Opening NPC identified as Yon; original lines come from the game's
    Ted keys.
  url: https://grime1.wiki.gg/wiki/Yon
- id: original-languages
  description: 'Original I2 FR/IT/RU columns in work/source.json. Yon Ted HUB 2:2:
    arrivé/venuto/попал; Listener Desert1:2: perdu/perso/растворился; Shidra EN Heod
    Palace:1 his, RU Initial:1 надеялся; Art Trader RU Listen:3 спросил, FR Vendeur
    role name.'
style:
  tone: Precise UI; restrained ritual and body imagery; spontaneous, childish NPCs
    remain distinct.
  adaptation: Text-first adaptation; user confirmed opening vertical works on 2026-10-04.
    No performance/audio verification claimed.
  reading_conditions: Menu and descriptions can be inspected; dialogue advancement
    and speech-bubble timing need an in-game check. Movement hints appear during play,
    so keep them short.
  source: user
  note: User accepted all recommended direction choices on 2026-10-04. No added archaism,
    jokes or lore explanations.
  player_agreement: Prefer natural gender-free wording for the silent player. Local
    nouns govern agreement (Naczynie neuter, Rzeźbiony masculine, podróbka feminine).
    No global player gender inferred.
