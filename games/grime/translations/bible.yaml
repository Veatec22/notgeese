pitfalls:
- Force is stamina in mechanics, but literal force/siła in philosophical dialogue.
- DLC and legacy unused terms are still included. Developer IDs and credits remain
  verbatim with notes.
- Hebrew/transliterated words in memories and Child/Shidra dialogue remain verbatim;
  do not add lore explanations.
- Source sometimes has malformed tags (<i> used as closer, <>j). Preserve exact tokens;
  do not silently repair engine syntax.
- Numeric suffixes must be sorted numerically, not lexically. Different branches are
  separate sequences.
- Characters mistake the protagonist for a Carven. Preserve mistaken identity; do
  not explain early.
- NPC grammatical genders are provisional editorial choices, not established biological
  identities. Avoid past tense for the silent player where natural.
- Unknown exact clipping limits; long descriptions need in-game checks, not automatic
  shortening.
