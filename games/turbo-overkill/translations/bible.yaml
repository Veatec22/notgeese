# Turbo Overkill bible: facts with sources.

sources:
  - id: keys
    description: The `term` field in TurboVoices, e.g. vo_e3m1_7_syn; speaker in the key suffix.
  - id: cast
    description: Voice cast (SYN, Patricia Summersett; The Exec, DB Cooper, actress)
    url: https://english-voice-over.fandom.com/wiki/Turbo_Overkill_(2023)
  - id: dbcooper
    description: DB Cooper's bio with feminine pronouns
    url: https://www.thegdex.com/speakers-2025/db-cooper
  - id: ru
    description: The game's Russian table (work/ref-ru.json), past-tense gender; a hint
  - id: text
    description: The game's original text, pronouns and address about a character

characters:
  - id: samm
    name: S.A.M.M.
    gender: m
    key: '^TurboVoices vo_.*_samm$'
    addresses_player: pan ("sir")
    register: polite, dry British humor, rare swearing for effect
    source: [keys, ru, text]
    note: '"Think of him as your mom, dad…" (mom''s recording); RU "я знал".'
  - id: syn
    name: SYN
    gender: f
    key: '^TurboVoices vo_.*_syn$'
    addresses_player: ty
    register: grandiose, godlike, no profanity
    declension: indeclinable ("bez SYN", "SYN pochłonęła"); "wirus SYN", "program SYN, który…"
    source: [cast, ru, text]
    note: RU "я пришла"; "protect your mother"; S.A.M.M. says "her", "madame".
  - id: exec
    name: Dyrektor
    gender: f
    key: '^TurboVoices vo_.*_exec$'
    addresses_player: ty ("kid")
    register: corporate hustler, lots of swearing
    source: [cast, dbcooper, text]
    note: Ripper calls her "boss lady". Label "Dyrektor" stays (noun for either gender).
  - id: maw
    name: Maw
    gender: m
    key: '^TurboVoices vo_.*_maw$'
    addresses_player: ty
    register: brutal, mocking, later deranged
    declension: Mawa, Mawem, Mawowi
    source: [keys, ru, text]
  - id: ripper
    name: Ripper
    gender: f
    key: '^TurboVoices vo_.*_ripper$'
    addresses_player: ty
    register: psychopathic, flirty, vulgar
    declension: indeclinable (feminine name ending in a consonant)
    source: [text]
    note: '"Ripper, bless her heart" (the Exec''s recording). RU "я убил" is an error of the Russian version.'
  - id: jazz
    name: Jazz
    gender: m
    key: '^TurboVoices vo_.*_jazz$'
    addresses_player: ty
    source: [text]
    note: '"Gotta assume he’s been mulched" (S.A.M.M. about Jazz).'
  - id: doc
    name: Doktor (dr Nyx)
    gender: m
    key: '^TurboVoices vo_.*_doc$'
    addresses_player: ty
    source: [text]
    note: '"He kept himself a little backup copy" (the Exec about the Doc).'
  - id: captain
    name: Kapitan (Cynobrowy Front)
    gender: m
    key: '^TurboVoices vo_.*_captain$'
    addresses_player: ty ("son")
    source: [text]
    note: The sergeant answers the captain "It is, sir".
  - id: johnny
    name: Johnny Turbo (niemy gracz)
    gender: m
    declension: Johnny'ego, Johnny'emu; "Turbo" indeclinable
    source: [text]

