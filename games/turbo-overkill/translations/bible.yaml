settings:
  dialog_key: '^TurboVoices (?:vo|combat)_'
  max_line: 42

ignore:
  - check: address
    key: 'vo_e3m1_(14|19)_samm$'
    reason: S.A.M.M. speaks to SYN here, not Johnny.
  - check: terms
    key: 'augment_chegg_(short)?desc$'
    reason: the "Piłonoga" item description; "noga z piłą" explains the name on purpose.
  - check: terms
    key: 'vo_e1m8_17_exec$|vo_e1m4_6_samm$|vo_e1m7_5_samm$|vo_e2m8_16_exec$'
    reason: term replaced by a pronoun or "urządzenie", per the line's context.
  - check: terms
    key: 'infodex_log_doc1_desc$'
    reason: '"augment" as a verb ("ulepszające ciało").'
  - check: english
    key: 'jukebox_|credits_'
    reason: song titles and company names stay original.
  - check: typography
    key: 'jukebox_'
    reason: quotes follow the original; title unchanged.
  - check: consistency
    key: 'hitmarker|Hold the line|hold_the|secret_desc_orbit|vo_e3m3_36_combat|mtoggle_low|restart$|endtally|shop_(exit|leave|back)|workshopbrowser_rateleave|conf_editor4|character_syn|TurboStrings syn$|vo_e3m8_(5|16)_maw|combat_jazz_flinch0[456]|mtoggle_head|augmentcategoryalt_head|outskirts|texbrowser_c6|skilldesc3|menu_cs_[17]|cd_start|credit_char9|buzby1_title|codex_stimpack|menu_disp|menu_return'
    reason: differences come from context (sound vs marker, setting kind, caps, character label) or differ only in case.
  - check: consistency
    key: 'ammo_shells$|codex_shells$'
    reason: the ammo counter has short "Naboje", the infodex full "Naboje do strzelby".
  - check: capitals
    key: 'jukebox_ripper$|editor_publishtosteam$|credit_char7$'
    reason: proper names (song title, Warsztat Steam, Radio Paradise).
  - check: consistency
    key: 'coop_prompt_(create|join)roomfailed$'
    reason: source error; the "join" entry says "Create Room Failed"; PL follows the key.
