keep_english:
  - Zombie Kingz
  - 1000 Year Royals
  - The Dredged
  - Charon
  - Lux in Tenebris
  - Le Sniper Du Cœur
  - Quid Pro Quo
  - Baba Yaga

settings:
  max_line: 0   # unknown; fontTiny is very small, check in game

ignore:
  - check: typography
    key: '.*'
    reason: game fonts have no „ ” and no en dash; straight quotes and hyphen are deliberate (style.technical)
  - check: missing
    key: '^s1724$'
    reason: "' Souls' after the number deliberately empty; the unit is in the header 'NAGRODA W DUSZACH: '"
  - check: english
    key: 'map_portal/Name$'
    reason: '"portal" is also a Polish word'
  - check: terms
    key: 'map_mission5/Description$'
    reason: flames' verse; "piekielne psy" as a poetic variant of the term
  - check: terms
    key: 'map_mission22/Description$'
    reason: flames' verse; "zapomnianych trupów rój" to rhyme with "twój"
