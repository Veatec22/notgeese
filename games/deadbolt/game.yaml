title: DEADBOLT
version: "0.3"
entries: { done: 619, total: 619 }
tested: partial
engine: GameMaker Studio 1.4 (VM, bytecode 15), x86
approach: Własny plugin d3d9.dll poprawia dane gry w pamięci przy starcie, zanim silnik je rozbierze — polskie napisy w tabeli STRG, polskie litery dołożone do trzech fontów gry, dialogi dia_*.json tłumaczone do notgeese/cache. Żaden plik gry nie jest podmieniany; bez stałych adresów i sum kontrolnych.
scope: Pełne — menu główne i pauzy, ustawienia i sterowanie, wybór i opisy misji, podpowiedzi, cele, broń, osiągnięcia, okrzyki wrogów i bossów, wszystkie rozmowy z płomieniami (wiersze), notatki i sejfy, nagrania z kaset, porady po śmierci, napisy końcowe oraz napisy na grafikach (menu główne, samouczek, teczka misji, sklep Charona, powiadomienie o nowej broni). 619 wpisów; nazwy gangów i imiona w oryginale. Poza zakresem edytor map.
test_notes: Vertical confirmed in game by the user (2026-09-25). Full translation after the independent language review and verse rewrite, checked with the no-game plugin test and installed locally; full playthrough pending. 0.2 adds four texture headings (Charon shop and new-weapon notification); translation-only build and no-game harness passed, 19 labels across 11 sprite frames. Purchase notification rendering awaits user confirmation. 0.3 keeps the translation; DLL shared with the Ultrawide mod (features switched on by their files); harness passes PL, PL+ultrawide and ultrawide-only.
