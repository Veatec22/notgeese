approach: Własny plugin d3d9.dll poprawia dane gry w pamięci przy starcie, zanim silnik je rozbierze — polskie napisy w tabeli STRG, polskie litery dołożone do trzech fontów gry, dialogi dia_*.json tłumaczone do notgeese/cache. Żaden plik gry nie jest podmieniany; bez stałych adresów i sum kontrolnych.
scope: Pełne — menu główne i pauzy, ustawienia i sterowanie, wybór i opisy misji, podpowiedzi, cele, broń, osiągnięcia, okrzyki wrogów i bossów, wszystkie rozmowy z płomieniami (wiersze), notatki i sejfy, nagrania z kaset, porady po śmierci, napisy końcowe oraz napisy na grafikach (menu główne, samouczek, teczka misji). 619 wpisów; nazwy gangów i imiona w oryginale. Poza zakresem edytor map.
test_notes: Vertical confirmed in game by the user (2026-09-25). Full translation after the independent language review and verse rewrite, checked with the no-game plugin test and installed locally; full playthrough pending.
