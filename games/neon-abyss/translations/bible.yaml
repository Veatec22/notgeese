# Neon Abyss bible: facts with sources.

sources:
  - id: keys
    description: "I2 keys in work/source.json, e.g. Dialogue1004_7_Secretary; speaker at the end of the key."
  - id: ru
    description: "Russian column of the same I2 table (globalgamemanagers.assets, object 3492); past-tense gender."
  - id: text
    description: "English original: he/she in descriptions, line context."

characters:
  - id: hades
    name: Hades
    gender: m
    key: '_Hades$'
    addresses_player: ty
    register: "bar boss, stingy hustler, complains about the budget"
    source: [ru, text]
    note: "RU \"Недавно я ездил\", \"я все понял\"."
  - id: lans
    name: Lans (inwestor)
    gender: m
    key: '_Lans$'
    addresses_player: '-'
    register: "domineering investor, \"ty\" to Hades"
    source: [text]
    note: "Hades: \"The stupid investor... What does he expect\", Secretary: \"What does he want this time?\". RU doesn't settle it."
  - id: secretary
    name: Sekretarka
    gender: f
    key: '_Secretary(_0\d)?$'
    addresses_player: ty
    register: "corporate stickler, threatens pay cuts"
    source: [ru, text]
    note: "RU \"Должна сказать\", Hades: \"Talk to her\". Player is \"Pracownik nr 233\"; no past tense about the player."
  - id: programmer
    name: Programista (Sir Żarłocelot)
    gender: m
    key: '_[Pp]rogrammer$'
    addresses_player: wy
    register: "clumsy braggart"
    source: [ru, text]
    note: "RU \"чуть не забыл\", addresses \"вы\", \"Hello strangers\"."
  - id: stylist
    name: Stylistka
    gender: f
    key: '_Stylist$'
    addresses_player: ty
    source: [ru, text]
    note: "RU \"я была графическим дизайнером\", Secretary: \"she's good with computers\"."
  - id: bartender
    name: Barmanka
    gender: f
    source: [text]
  - id: player
    name: "gracz (Anna, Amir, James, Saya, Lucas, Matt, Ming, R-6, Wade, Zack)"
    gender: '?'
    note: "Characters of both genders: everything said to the player is genderless (no \"zrobiłeś\", \"gotowy\")."
  - id: pets
    name: zwierzaki
    gender: '?'
    note: "EN gives he/she, the Polish name has its own gender (KAKTUSIK vs \"she\"): descriptions without pronouns."

