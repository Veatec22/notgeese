engine: Unity 2020.3.45 (Mono), wbudowany BepInEx 5.4.17 i system modów Remix
approach: Mod Remix z pluginem, który dodaje do gry osobny język „POLSKI”. Polskie teksty leżą w folderze moda w formacie samej gry; fonty gry mają polskie litery. Żaden plik gry nie jest podmieniany, a paczka nie niesie BepInEksa — gra ma własny.
scope: Całość z dodatkami Downpour i The Watcher — menu, opcje, Remix, Wyprawy, podpowiedzi, nazwy regionów i stworzeń, rozmowy z iteratorami, odczyty pereł, echa, czatlogi i transmisje oraz komentarz twórców. Po angielsku zostają grafiki z napisami, napisy końcowe i ukryta minigra Inv.
