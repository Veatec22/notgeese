  - {en: slugcat, pl: ślimakot, forms: [ślimakot], source: [wiki-pl]}
  - {en: slugpup, pl: ślimakocię, forms: [ślimakoci], source: decision, note: in Jolly Co-op "pup" is "maluch"}
  - en: Survivor
    pl: Ocalały
    forms: [ocalał]
    source: [wiki-pl, ru]
    note: >-
      Wiki has both "Przetrwaniec" and "Ocalały"; RU "Выживший". The vertical had
      "Przetrwaniec"; changed in the full translation to the more natural "Ocalały".
  - {en: Monk, pl: Mnich, forms: [mnich], source: [wiki-pl]}
  - {en: Hunter, pl: Łowca, forms: [łowc], source: [wiki-pl]}
  - {en: Gourmand, pl: Smakosz, forms: [smakosz], source: decision, note: "indulger of the simpler pleasures"}
