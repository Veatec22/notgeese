settings:
  dialog_key: '^dlg:'

ignore:
  - check: terms
    key: '^dlg:lm_tower09-white\.txt#'
    reason: Andrew expands English region abbreviations; names stay English since they explain the abbreviations
  - check: terms
    key: '^(str:The passage of time|dlg:126\.txt#9|dlg:sh_e04riv-white\.txt#5)'
    reason: time passing ("passage of time"), not a passage
  - check: typography
    key: '^dlg:(138|139)\.txt#'
    reason: '" : -30" is a game instruction that hides the line (as in EN)'
  - check: terms
    key: '^str:(watcher-name|watcher-description)$'
    reason: DLC name The Watcher stays English
