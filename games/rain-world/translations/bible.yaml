    forms: [pirotechni]
    source: decision
    note: >-
      "master of pyrotechnics and explosives"; wiki "Artyficer", RU "Техник" (masculine noun as a
      name). In commentary Andrew says "she" and "her children"; the name stays and pronouns in those
      lines go via "ta postać"/"jej". "Pirotechniczka" rejected; the user accepted "Pirotechnik"
