# Rain World bible: facts with sources.

sources:
  - id: wiki-pl
    description: Polish version of the official wiki (Miraheze), community-translated; incomplete and inconsistent (Survivor as both "Przetrwaniec" and "Ocalały").
    url: https://rainworld.miraheze.org/wiki/Creatures/pl
  - id: wiki-pl-outskirts
    description: Outskirts region page on the Polish wiki (Obrzeża, Mnich, Włócznik).
    url: https://rainworld.miraheze.org/wiki/Outskirts/pl
  - id: code
    description: Context from work/en.json, the game classes where a text sits in code (tools/StrMap.cs).
  - id: ru
    description: The game's Russian table (work/ref-rus.json), past-tense gender, names and abbreviations.
  - id: mechanics
    description: Findings from the game code, in docs/technical.md.

characters:
  - id: player
    name: ślimakot gracza
    gender: m
    addresses_player: ty
    register: hints and descriptions address the player in 2nd person, briefly
    source: [code, decision]
    note: >-
      English doesn't give slugcats a gender; "ślimakot" is masculine, so forms about the player
      ("jesteś głodny", "wróciłeś") follow the noun. Iterators call it "it": where it's
      "stworzenie", neuter ("jest zbyt głupie").
  - id: moon
    name: Patrząca na Księżyc (przezwisko Luna)
    gender: f
    key: 'SLOracleBehavior|MoonConversation'
    addresses_player: ty; to the player "mały stworku", "przyjacielu", "mały archeologu"
    register: warm, tired, polite; broken sentences after damage
    source: [ru]
    note: RU "Смотрящая-на-Луну", "я устала", "я говорила"
  - id: pebbles
    name: Pięć Kamyków (przezwisko Kamyk)
    gender: m
    key: 'SSOracleBehavior|PebblesConversation|CLOracleBehavior|SSOracleRotBehavior'
    addresses_player: ty; "mały stworku"
    register: cold, haughty, sarcastic; subdued in the Saint campaign
    source: [ru]
    note: >-
      In Downpour the same class (SSOracleBehavior, SSSleepoverBehavior) also speaks for
      pre-collapse Moon in the Spearmaster campaign; gender set line by line from RU
      ("я думала", "я рада" = Moon; "я занят", "побыть один" = Pebbles).
  - id: spinning-top
    name: Bąk (Spinning Top)
    gender: m
    addresses_player: ty; about the player in 3rd person neuter ("jest zbyt głupie")
    register: mocking, childish, exclamations "OA!"
    source: [ru]
    note: >-
      RU often avoids gendered forms ("мне хотелось"), but dialogue 209 has "Я провёл":
      masculine; also agrees with the noun "bąk".
  - id: prince
    name: Książę (Prince, Watcher)
    gender: m
    register: exalted, courtly ("Albowiem zostaniesz wywyższony")
    source: [decision]
  - id: chatlog-iterators
    name: iteratory o nieustalonej płci (GW, HR, UU, WO, EOC, PG, SI, PI, Niezrównana Niewinność)
    gender: '?'
    register: gossipy chat of iterator groups
    source: [ru]
    note: >-
      RU consistently avoids gender in their lines; so do we ("doszły mnie", "nie wypada mi").
      Male per RU: SCS, BZN, NGI; female: SSL, Luna, Drzazga Słomy.
  - id: ancient-documents
    name: listy i zwoje starożytnych (perły 42, 237, 238)
    gender: '?'
    source: [decision]
    note: >-
      Genderless unless the text says: in 238 the author writes "Nine-Leaf, when he comes"
      (Ea-nasir complaint parody), so masculine there.
  - id: developers
    name: twórcy More Slugcats w komentarzu (Andrew, Will, Dakras, Norgad, Screams, Cappin, Slugitar i in.)
    gender: '?'
    addresses_player: ty / wy
    register: loose, enthusiastic, jokes about making the game
    source: decision
    note: >-
      Real people; no gender inferred from names or nicknames. First person without gendered
      forms ("udało mi się", "moim zamiarem było", passive). Other developers in 3rd person only as
      the original says ("he" Cappin, "they" Minkimaro/Ender → genderless). Game characters are
      masculine nouns (Pirotechnik, Strumyk) and forms agree with them, unless a developer stresses
      gender: then "ta postać", "ona" (Artificer: Andrew says "she", "her children").

