sources:
  - id: files
    description: Src/talk.ini (briefings), Src/ENDS.ini (debriefs), Src/chat.ini (in-level lines), Src/LEVELS/SETTINGS.ini and Assets.dat images of the GOG install.
  - id: foreign
    description: Official talk/ENDS -fre, -ger, -ita, -spa of the same game. No random word pools; fixed sentences.
  - id: store
    url: https://www.gog.com/en/game/not_a_hero
    description: BunnyLord runs for mayor and orders the city cleaned up.
  - id: font
    description: Atlas 5873 (dialogue window font) has BunnyLord's purple head in the '*' cell; the game censors swearing with it.

characters:
  - id: bunnylord
    name: BunnyLord
    gender: m
    key: '^Src/(talk|ENDS)\.ini\|'
    addresses_player: wy in briefings (the team), ty in debriefs (one agent, gender unknown)
    register: absurd politician from the future, enthusiastic, vulgar, no brakes
    declension: BunnyLord, BunnyLorda, BunnyLordowi (capital letter irrelevant in all-caps text)
    source: [files, store]
  - id: agent
    name: $NAME$ (Steve, Cletus, Samantha, Ronald, Clive, Mike, Jesus, Kimmy, Stanley)
    gender: '?'
    addresses_player: '-'
    register: the player's chosen character; women among agents (Samantha, Kimmy)
    note: >-
      Forms to and about the agent impersonal or neutral: "poszło ci", "dałoby się", "umrę",
      never "zrobiłeś/zrobiłaś". Applies to ENDS.ini, intro sections [111111111], [12121213430]
      and chat.ini. Exception: CELLPHONE calls to Steve (masculine).
    source: [files]
  - id: ruby
    name: ciocia Ruby
    gender: f
    source: [files]
  - id: akemi
    name: Akemi Unagi
    gender: f
    source: [files]
  - id: bogdan
    name: Bogdan Nabatov
    gender: m
    source: [files]
  - id: upgraydd
    name: Upgraydd
    gender: m
    source: [files]

