keep_english: [BunnyLord, BUNNYLORD, Steve, Cletus, Samantha, Ronald, Clive, Mike, Jesus, Kimmy, Stanley, Vodkaville, Bredrin Park, Sushicentral, Upgraydd, Akemi, Unagi, Bogdan, Nabatov, RESET, NINJA, SUSHI, RASCLAT, BUMBACLAT, SAMMY, DALLAS, RASMUS, SOUTH WEDINSTONE, DOJO A GOGO, MANIPULATOR, MECHANOID, MEGA, SUPER, ULTRA, ROBOT, TERROR, WOMBAT, MMMMMMMMM]

randomizer:
  rule: >-
    Official FR/DE/IT/ES dropped the pools. In Polish adjective pools became adverbs, which
    don't decline: "JEST $AWESOME$", "$TERRIBLE$ ZŁY WRÓG", "BĘDZIE $FUCKING$ $TERRIBLE$".
    Noun and verb pools replaced by fixed words. Tokens tied to an image or gameplay stay,
    in nominative.
  adverbs: [FUCKING, ANFUCKING, AWESOME, ANAWESOME, TERRIBLE, ANTERRIBLE, MEDIOCRE, ANMEDIOCRE, DESCRIPTION, ANDESCRIPTION, ADJECTIVE, ANADJECTIVE]
  predicate_mi: DISSAPOINTED as "JEST MI $DISSAPOINTED$" (SMUTNO, PRZYKRO…)
  adverbial: QUANTITIES as indeclinable time adverbials
  interjection: FUCK only as a standalone interjection; INSULTS only after "CO ZA"
  nominative: [SUBJECTOBJECT, SCENEOBJECT, THESCENEOBJECT, NAME]
  note: $SUBJECTOBJECTS$ (English appends S) replaced by $SUBJECTOBJECT$ in quotes.

settings:
  dialog_key: '^Src/(talk|ENDS)\.ini\|\d'
  max_line: 170

ignore:
  - check: english
    key: '\|(111111111|12121213430)\|5$|^Src/ENDS\.ini\|10\|8$'
    reason: Lines made only of pool adverbs; Polish text equals English.
  - check: consistency
    key: '\|(AN)?(TERRIBLE|DESCRIPTION)\|'
    reason: Pools have separate vocabularies; DREADFUL in TERRIBLE and DESCRIPTION differ by synonym on purpose.
  - check: length
    key: '\|VERBE?D?\|'
    reason: Verb pools aren't used in Polish sentences.
  - check: tokens
    key: '^menu\|controller_detected$'
    reason: Braces mark white words in the image (tools/menus.py), not text.
  - check: terms
    key: '^exe\|0x305d34$'
    reason: The EXE key label has 11 bytes; WŚLIZG = BTN (12) doesn't fit, ŚLIZG stays.
  - check: consistency
    key: '^(menu\|(main|election|election_day)|exe\|0x303978|card\|\d+)$'
    reason: Same English label in places of different width or for characters of another gender (SZYBKI/SZYBKA).
